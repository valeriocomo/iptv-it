# Run with: docker compose run --rm playlist-generator
services:
  playlist-generator:
    build: ./playlist
    image: playlist-generator
    # write the file as your user, not as root (Linux).
    # Default 1000:1000; otherwise run:
    #   PUID=$(id -u) PGID=$(id -g) docker compose run --rm playlist-generator
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - OUTPUT_DIR=/data/public
      # - SOURCE_URL=https://...   # upstream playlist (default: Tundrak iptvitaplus.m3u)
    volumes:
      # the folder containing this file (your repository clone);
      # use an absolute path instead if compose.yml lives elsewhere
      - .:/data

  epg-generator:
    build: ./epg
    image: epg-generator
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - PLAYLIST=/data/public/iptvitaplus.m3u
      - OUTPUT=/data/public/guide.xml
      # - DAYS=3              # days of guide to download (default: per source)
      # - MAX_CONNECTIONS=5   # parallel requests to the guide sites
    volumes:
      - .:/data      